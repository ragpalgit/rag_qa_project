name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Build release archives
        run: |
          set -euo pipefail
          mkdir -p dist
          repo_name="${GITHUB_REPOSITORY#*/}"
          version="${GITHUB_REF_NAME:-manual}"
          prefix="${repo_name}-${version}/"

          git archive --format=zip --prefix="$prefix" --output="dist/${repo_name}-${version}.zip" HEAD
          git archive --format=tar.gz --prefix="$prefix" --output="dist/${repo_name}-${version}.tar.gz" HEAD

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.tar.gz
